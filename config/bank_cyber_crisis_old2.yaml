        description: Rozpoczynasz migrację ERP do alternatywnego dostawcy. Eliminujesz ryzyko u źródła — ale 6–12 miesięcy projektu w środku kryzysu to samo w sobie nowe ryzyko.
        impacts:
          plynnosc: -18
          cyber: 10
          regulacje: 3
          reputacja: 5
        stock_delta: -5.0
