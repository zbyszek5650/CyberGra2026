        description: Rozstawiasz pułapki (honeypoty) w sieci OT, by obserwować poczynania APT i zbierać dane wywiadowcze. Uczysz się o przeciwniku — ale każda godzina obserwacji to ryzyko utraty wpływu
          na fizyczną infrastrukturę.
        impacts:
          plynnosc: -3
          cyber: 10
          regulacje: -5
          reputacja: -3
        stock_delta: -2.0
