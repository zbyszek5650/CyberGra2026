    - 'Odpowiedź na incydent: rollback vs. segmentacja vs. threat hunting'
    - Odpowiedzialność dostawcy wobec tysięcy poszkodowanych klientów
  - id: S4R2
    title: Analiza Backdoora i Zasięgu Kompromitacji
    narrative: 'Analiza forensic ujawnia, że backdoor umożliwiał atakującym pełen dostęp do bazy ERP — dane finansowe, HR, łańcuch dostaw. Przez 3 dni mogli czytać, kopiować i modyfikować dane. Nie wiadomo,
