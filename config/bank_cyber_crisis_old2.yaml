        description: Żądasz pełnego dostępu do raportów bezpieczeństwa dostawcy i audytu jego praktyk. Twarda gra — dostawca może odmówić, ale 2000 poszkodowanych firm to realny argument.
        impacts:
          plynnosc: -5
          cyber: 8
          regulacje: 10
          reputacja: 10
        stock_delta: 0.0
      - label: Powołaj konsorcjum poszkodowanych firm — siła w liczbach
        description: Tworzysz konsorcjum poszkodowanych klientów dostawcy. Wspólna siła negocjacyjna, prawna i medialna wobec dostawcy, który zawodzi wszystkich naraz.
        impacts:
          plynnosc: -3
          cyber: 5
          regulacje: 8
          reputacja: 12
        stock_delta: 1.0
