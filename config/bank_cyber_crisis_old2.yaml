        description: Town hall z pełną informacją o sytuacji i planie działań. Zaufanie pracowników w kryzysie — przy poziomie narażenia na przecieki wewnętrzne.
        impacts:
          plynnosc: -3
          cyber: 0
          regulacje: 5
          reputacja: 12
        stock_delta: 1.0
      - label: Informacja tylko dla zarządu i menedżerów — kontrolowany obieg
        description: Informacja tylko dla kadry zarządzającej, kontrolowany obieg dokumentów. Mniej przecieków, więcej plotek — i to pracownicy jako ostatni dowiadują się o własnych danych.
        impacts:
          plynnosc: 0
          cyber: 0
          regulacje: -5
          reputacja: -8
        stock_delta: -2.0
      - label: Powołaj dedykowany crisis team z udziałem pracowników każdego działu
        description: Zespół kryzysowy z przedstawicielami każdego działu. Decyzje zapadają z wiedzą operacyjną ludzi z pierwszej linii.
        impacts:
          plynnosc: -5
          cyber: 3
          regulacje: 8
          reputacja: 10
        stock_delta: 0.0
