        description: 'Zakładasz najgorszy scenariusz (assume breach): wszystkie dane z ERP traktujesz jako skompromitowane i resetujesz sekrety. Drobiazgowe i kosztowne, ale eliminuje niewiadome.'
        impacts:
          plynnosc: -12
          cyber: 18
          regulacje: 8
          reputacja: 3
        stock_delta: -3.0
