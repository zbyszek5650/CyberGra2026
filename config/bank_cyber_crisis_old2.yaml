game_title: 🛡️ CyberGra v4 — Symulacja Kryzysu Cyberbezpieczeństwa
game_subtitle: Podejmuj decyzje. Zarządzaj ryzykiem. Chroń organizację.
metrics:
- id: plynnosc
  name: Kondycja Finansowa i Płynność
  icon: 💰
  initial: 100
  color: '#10b981'
- id: cyber
  name: Bezpieczeństwo Cybernetyczne
  icon: 🔒
  initial: 100
  color: '#6366f1'
- id: regulacje
  name: Zgodność z Regulacjami
  icon: ⚖️
  initial: 100
  color: '#f59e0b'
- id: reputacja
  name: Zaufanie Interesantów
  icon: 🏛️
  initial: 100
  color: '#06b6d4'
initial_stock_price: 120.0
elimination_stock_drop_pct: 60
elimination_metric_min: 5
scenarios:
- id: S1
  title: Atak na Sektor Bankowy
  subtitle: SWIFT • Ransomware • Panic Run • DDoS • UODO • Zero Trust
  description: 'Wieloetapowy, skoordynowany cyberatak na Bank Północny — jeden z największych banków komercyjnych w Polsce. Atakujący wykorzystują luki w systemie SWIFT, wdrażają ransomware na systemach
    core bankowych, wywołują panikę depozytariuszy i paraliżują kanały elektroniczne. Finał: kontrola UODO i KNF oraz przebudowa architektury Zero Trust. Gracze (CISO i CEO) poznają pełny cykl zarządzania
    incydentem sektora finansowego.'
  icon: 🏦
  initial_stock_price: 120.0
  rounds:
  - id: S1R1
    title: Kompromitacja Systemu SWIFT
    narrative: 'Poniedziałek, 06:42. Systemy monitoringu wykrywają anomalię: w ciągu nocy z systemu SWIFT wysłano 14 nieautoryzowanych przelewów na łączną kwotę 47 mln USD do banków w Azji Południowo-Wschodniej.
      Departament Compliance potwierdza — to nie były zaplanowane transakcje. Trwa wyścig z czasem: część środków może jeszcze zostać zablokowana, jeśli zareagujecie w ciągu najbliższych 2 godzin.

      '
    broadcast: '⚡ PILNE: Wykryto nieautoryzowane przelewy SWIFT — 47 mln USD. Trwa analiza incydentu.'
    ciso_question:
      role: CISO
      text: Wykryto 14 nieautoryzowanych przelewów SWIFT. Jak reagujesz jako CISO?
      options:
      - label: Natychmiastowa izolacja systemu SWIFT i uruchomienie SOC w trybie P1
        description: Odcinasz SWIFT od sieci korporacyjnej i podnosisz priorytet SOC do P1 (najwyższy). Wszystkie przelewy międzynarodowe stają — tracisz prowizje i czas klientów, ale odcinasz atakującym
          możliwość kolejnych wyprawek.
        impacts:
          plynnosc: -8
          cyber: 15
          regulacje: 5
          reputacja: -3
        stock_delta: -3.5
      - label: Analiza forensic bez izolacji — zbieranie dowodów na żywym systemie
        description: Pozostawiasz system aktywny, żeby śledzić atakującego i zebrać pełne dowody na żywym systemie. Każda godzina obserwacji to jednak kolejne nieautoryzowane transakcje, a regulator później
          uzna brak izolacji za zaniedbanie.
        impacts:
          plynnosc: -15
          cyber: 5
          regulacje: -5
          reputacja: -8
        stock_delta: -7.0
      - label: Powiadomienie CERT.PL i NBP, prośba o koordynację międzybankową
        description: Zgłaszasz incydent do CERT Polska i NBP oraz prosisz banki korespondenckie o blokadę środków. Procedury zajmują czas, ale odzyskujesz część z 47 mln USD i wzmacniasz pozycję wobec regulatora.
        impacts:
          plynnosc: -5
          cyber: 8
          regulacje: 12
          reputacja: 2
        stock_delta: -2.0
      - label: Cicha blokada podejrzanych transakcji, bez alarmowania zespołu
        description: Blokujesz podejrzane transakcje ręcznie, bez uruchamiania procedur incydentowych i bez informowania zespołu. Minimalizujesz panikę, ale bez analizy forenzycznej nie znasz skali kompromitacji
          — a obowiązek zgłoszenia incydentu nadal na Tobie ciąży.
        impacts:
          plynnosc: -3
          cyber: -10
          regulacje: -15
          reputacja: 0
        stock_delta: -1.5
    ceo_question:
      role: CEO
      text: CISO informuje o wycieku 47 mln USD przez SWIFT. Media jeszcze nie wiedzą. Co robisz?
      options:
      - label: Zwołaj natychmiastowe posiedzenie zarządu i Rady Nadzorczej
        description: Zwołujesz zarząd i radę nadzorczą, formalnie uruchamiając łańcuch decyzyjny i dokumentując reakcję. Decyzje podejmowane są wolniej, ale nikt nie zarzuci Ci samodzielnych ruchów wobec
          regulatora i mediów.
        impacts:
          plynnosc: -2
          cyber: 3
          regulacje: 10
          reputacja: 5
        stock_delta: -1.0
      - label: Skontaktuj się bezpośrednio z bankami-odbiorcami w celu zablokowania środków
        description: Osobiście dzwonisz do banków odbiorców w Singapurze i Hongkongu, by zablokować środki, zanim zostaną wypłacone. Działasz operacyjnie poza procedurami — możliwy odzysk części pieniędzy,
          ale pomijasz formalną ścieżkę nadzoru.
        impacts:
          plynnosc: 10
          cyber: 0
          regulacje: -3
          reputacja: 2
        stock_delta: 2.0
      - label: Przygotuj proaktywny komunikat prasowy zanim media się dowiedzą
        description: Publikujesz komunikat, zanim dziennikarze dotrą do tematu — kontrolujesz narrację od pierwszej minuty i spełniasz wymogi zgłoszenia. Krótkoterminowy spadek kursu to cena za wiarygodność
          długoterminową.
        impacts:
          plynnosc: -5
          cyber: 0
          regulacje: 8
          reputacja: 12
        stock_delta: -4.0
      - label: Poczekaj na pełny raport CISO zanim podejmiesz jakiekolwiek działania
        description: Odraczasz wszelkie decyzje do momentu raportu końcowego CISO. Zyskujesz precyzję, ale tracisz dwugodzinne okno na blokadę środków — i ryzykujesz, że incydent ujawnią media, a nie Ty.
        impacts:
          plynnosc: -10
          cyber: -5
          regulacje: -8
          reputacja: -5
        stock_delta: -5.0
    learning_points:
    - 'Dylemat odpowiedzi na incydent: izolacja (bezpieczeństwo) vs. zbieranie dowodów (inteligencja)'
    - Okno czasowe na blokadę transakcji SWIFT liczy się w godzinach — szybkość reakcji decyduje o stratach
    - 'Obowiązek zgłoszenia incydentu: CERT i regulator (ustawa o krajowym systemie cyberbezpieczeństwa)'
  - id: S1R2
    title: Ransomware na Systemy Core Bankowe
    narrative: 'Środa, 14:15. Trzy dni po incydencie SWIFT, systemy core bankowe zaczynają się zawieszać. Na ekranach pojawia się komunikat: „Wasze dane zostały zaszyfrowane. Żądamy 200 BTC w ciągu 72h.
      Tick-tock." Zaszyfrowane zostały bazy transakcyjne, system rachunkowości oraz archiwum kredytowe. Backup sprzed 24h istnieje, ale nie wiadomo, czy nie jest skompromitowany.

      '
    broadcast: '🔴 ALERT: Ransomware zaatakował systemy core bankowe. Żądanie okupu: 200 BTC. Systemy niedostępne.'
    ciso_question:
      role: CISO
      text: 'Ransomware zaszyfrował systemy core bankowe. Żądanie: 200 BTC w 72h. Twoja decyzja?'
      options:
      - label: Uruchom procedurę Disaster Recovery — restore z backupu po weryfikacji integralności
        description: Izolujesz środowisko, weryfikujesz kopię zapasową w piaskownicy, a następnie przywracasz systemy z backupu (procedura Disaster Recovery). Pełne przywrócenie zajmie 48–72 h — ale nie
          finansujesz przestępców.
        impacts:
          plynnosc: -12
          cyber: 12
          regulacje: 5
          reputacja: -5
        stock_delta: -6.0
      - label: Negocjuj z atakującymi przez dedykowany kanał, kup czas
        description: Zatrudniasz profesjonalnych negocjatorów, żeby opóźnić termin i wydobyć informacje o grupie przestępczej. Nie planujesz płacić, ale sam kontakt z atakującymi to ryzyko prawne i potencjalny
          wyciek do mediów.
        impacts:
          plynnosc: -5
          cyber: 5
          regulacje: -8
          reputacja: -10
        stock_delta: -4.0
      - label: Wdróż dekryptor oparty na analizie próbek — próba odzyskania bez backupu
        description: Laboratorium identyfikuje wariant ransomware i sprawdza publicznie znane dekryptory oraz luki w implementacji szyfrowania. Tania próba, ale bez gwarancji — większość współczesnych rodzin
          nie ma znanych dekryptorów.
        impacts:
          plynnosc: -3
          cyber: 8
          regulacje: 0
          reputacja: -2
        stock_delta: -2.5
      - label: Zapłać okup, aby szybko przywrócić operacje
        description: Płacisz okup, aby szybko wznowić operacje. Nie masz gwarancji otrzymania klucza, finansujesz kolejne ataki, a regulator i banki korespondenckie mogą odmówić współpracy instytucji, która
          płaci przestępcom.
        impacts:
          plynnosc: -25
          cyber: -20
          regulacje: -15
          reputacja: -15
        stock_delta: -12.0
    ceo_question:
      role: CEO
      text: Bank jest sparaliżowany przez ransomware. Klienci nie mogą korzystać z usług. Co komunikujesz?
      options:
      - label: Konferencja prasowa — pełna transparentność o skali problemu
        description: Występujesz publicznie, opisujesz skalę problemu i plan naprawczy. Otwartość buduje zaufanie klientów i regulatora, choć chwilowo może napędzić panikę.
        impacts:
          plynnosc: -5
          cyber: 0
          regulacje: 10
          reputacja: 10
        stock_delta: -3.0
      - label: Komunikat o 'planowanych pracach serwisowych' — kupujesz czas
        description: Informujesz o „planowanych pracach serwisowych” zamiast o ataku. Kupujesz godziny spokoju, ale przy ransomware prawda prawie zawsze wychodzi na jaw — wtedy tracisz zaufanie i narazasz
          się na zarzut wprowadzania w błąd.
        impacts:
          plynnosc: 0
          cyber: 0
          regulacje: -12
          reputacja: -8
        stock_delta: 1.0
      - label: Aktywuj plan ciągłości działania — ręczna obsługa w oddziałach
        description: 'Uruchamiasz plan ciągłości działania (BCP): oddziały przechodzą na obsługę manualną, bankomaty działają offline. Obsługa jest wolniejsza, ale klienci zachowują dostęp do pieniędzy.'
        impacts:
          plynnosc: -8
          cyber: 3
          regulacje: 5
          reputacja: 5
        stock_delta: -2.0
    learning_points:
    - 'Strategie odpowiedzi na ransomware: backup/DR, negocjacje, dekryptory, okup'
    - 'Konsekwencje płacenia okupu: brak gwarancji, finansowanie przestępczości, reakcja regulatora'
    - Zasada 3-2-1 backupu i weryfikacja integralności przed odtworzeniem
  - id: S1R3
    title: Panic Run — Panika Depozytariuszy
    narrative: 'Piątek, 09:00. Informacja o cyberataku przedostaje się do mediów. Influencer finansowy z 2M obserwujących publikuje thread: „Wasze pieniądze w Banku Północnym nie są bezpieczne. Wyciągajcie
      TERAZ." W ciągu 2 godzin kolejki przed oddziałami sięgają 200 osób. Aplikacja mobilna pada pod obciążeniem. NBP dzwoni z pytaniem o płynność banku.

      '
    broadcast: '📉 KRYZYS: Masowe wypłaty depozytów. Kolejki przed oddziałami. NBP monitoruje sytuację płynnościową.'
    ciso_question:
      role: CISO
      text: Panika bankowa w toku. Systemy pod ekstremalnym obciążeniem. Jak zabezpieczasz infrastrukturę?
      options:
      - label: Skaluj infrastrukturę chmurową — priorytet dla kanałów cyfrowych
        description: Automatycznie skalujesz zasoby w chmurze, dodajesz CDN i load balancery, aby aplikacja mobilna wytrzymała ruch. Kosztuje, ale odciąża oddziały i utrzymuje klientów w kanale cyfrowym.
        impacts:
          plynnosc: -10
          cyber: 8
          regulacje: 3
          reputacja: 8
        stock_delta: -2.0
      - label: Wprowadź limity transakcji online dla ochrony płynności
        description: Ograniczasz dzienne limity przelewów i wypłat online. To tarcza dla płynności banku, ale klienci odbiorą to jak karę — i część z nich naprawdę przeniesie depozyty.
        impacts:
          plynnosc: 10
          cyber: 5
          regulacje: -5
          reputacja: -12
        stock_delta: -4.0
      - label: Aktywuj system anty-fraud do wykrywania fałszywych zleceń w chaosie
        description: Podnosisz czujność reguł antyfraudowych i monitorujesz nietypowe zlecenia w chaosie paniki. Chroni klientów przed phishingiem i oszustwami, wymaga jednak dostrajania, by nie blokować
          legalnych operacji.
        impacts:
          plynnosc: -3
          cyber: 12
          regulacje: 8
          reputacja: 3
        stock_delta: -1.0
    ceo_question:
      role: CEO
      text: Panika bankowa — klienci masowo wypłacają depozyty. NBP pyta o Twoją płynność. Działasz.
      options:
      - label: Poproś NBP o awaryjną linię płynnościową i komunikuj stabilność
        description: Zwracasz się do NBP o awaryjną linię płynnościową i komunikujesz stabilność. Silna poduszka finansowa, ale sygnał „bank potrzebuje pomocy” może na rynku zadziałać dokładnie odwrotnie.
        impacts:
          plynnosc: 15
          cyber: 0
          regulacje: 8
          reputacja: -5
        stock_delta: -3.0
      - label: Nagraj wideo-apel do klientów z osobistą gwarancją bezpieczeństwa
        description: 'Nagrywasz osobisty apel: „Wasze pieniądze są bezpieczne, odpowiadam osobiście”. Emocjonalny przekaz zatrzymuje część klientów — ale obietnica bez pokrycia w danych wyjdzie bokiem.'
        impacts:
          plynnosc: 3
          cyber: 0
          regulacje: 0
          reputacja: 15
        stock_delta: 3.0
      - label: Zaoferuj klientom podwyższone oprocentowanie za utrzymanie depozytów
        description: Oferujesz premię 1,5 p.p. do oprocentowania dla depozytów powyżej 3 miesięcy. Kosztowna obrona bazy depozytowej, skuteczna zwłaszcza wobec racjonalnych klientów.
        impacts:
          plynnosc: -8
          cyber: 0
          regulacje: 3
          reputacja: 10
        stock_delta: 1.0
      - label: Wprowadź tymczasowy limit wypłat gotówkowych w oddziałach
        description: Wprowadzasz dzienny limit wypłat gotówki 10 000 PLN. Chronisz rezerwę gotówkową, ale skojarzenia z Grecją 2015 r. mogą wywołać dokładnie to, przed czym chcesz chronić — pełną panikę.
        impacts:
          plynnosc: 12
          cyber: 0
          regulacje: -10
          reputacja: -20
        stock_delta: -8.0
    learning_points:
    - Mechanizm panic run i ryzyko systemowe banku (run na depozyty)
    - NBP jako pożyczkodawca ostatniej instancji — awaryjna linia płynnościowa
    - 'Komunikacja kryzysowa: autentyczność przywódcy vs. instrumenty finansowe'
  - id: S1R4
    title: DDoS na Infrastrukturę Elektroniczną
    narrative: 'Poniedziałek, 11:30. Gdy sytuacja z panic run wydaje się stabilizować, rozpoczyna się masowy atak DDoS na wszystkie kanały elektroniczne banku: bankowość internetowa, aplikacja mobilna,
      API partnerskie i nawet wewnętrzny intranet. Ruch sieciowy wzrasta 400x. Atakujący używają botnetu z 500 000 urządzeń IoT. W komunikacie twierdzą, że to dopiero początek.

      '
    broadcast: '🌐 ATAK DDoS: 400x wzrost ruchu sieciowego. Bankowość elektroniczna i mobilna niedostępna. Botnet IoT.'
    ciso_question:
      role: CISO
      text: Masowy DDoS z botnetu IoT — 500K urządzeń. Wszystkie kanały cyfrowe padły. Twoja strategia?
      options:
      - label: Aktywuj usługę anti-DDoS u dostawcy CDN — przerzuć ruch na scrubbing center
        description: Przekierowujesz ruch przez scrubbing center dostawcy usługi anti-DDoS (zmiana DNS, 30–60 min propagacji). Ruch ataku jest filtrowany, zanim dotrze do Twoich serwerów.
        impacts:
          plynnosc: -8
          cyber: 15
          regulacje: 3
          reputacja: 5
        stock_delta: -2.0
      - label: Blackhole routing — odetnij cały ruch zagraniczny
        description: Odcinasz cały ruch z zagranicy na poziomie routingu (blackholing). Natychmiastowa ulga dla infrastruktury, ale klienci i partnerzy zagraniczni tracą dostęp — a botnet może przenieść
          się na urządzenia w Polsce.
        impacts:
          plynnosc: -3
          cyber: 10
          regulacje: -5
          reputacja: -8
        stock_delta: -3.0
      - label: Uruchom zapasowe centrum danych z czystym IP range
        description: Przenosisz usługi na zapasowe centrum danych z nowym, czystym zakresem adresów IP. Botnet musi od nowa namierzyć cel — drogie i czasochłonne, ale bardzo skuteczne.
        impacts:
          plynnosc: -12
          cyber: 12
          regulacje: 5
          reputacja: 8
        stock_delta: -1.0
      - label: Skoncentruj się na obronie API partnerskich — klienci detaliczni poczekają
        description: Priorytetujesz API płatności i partnerów (POS, mobilne portfele) kosztem bankowości detalicznej. Utrzymujesz przychody z terminali, ale klienci detaliczni doświadczają niedostępności
          godzinami.
        impacts:
          plynnosc: 5
          cyber: 5
          regulacje: -8
          reputacja: -15
        stock_delta: -5.0
    ceo_question:
      role: CEO
      text: Bank jest cyfrowo sparaliżowany przez DDoS. Klienci nie mogą płacić kartami ani przelewami. Reakcja?
      options:
      - label: Uruchom współpracę z innymi bankami — umowy o wzajemnej obsłudze klientów
        description: 'Podpisujesz awaryjne porozumienia z innymi bankami: Twoi klienci wypłacają w bankomatach partnerów bez opłat. Solidarność sektorowa utrzymuje obsługę i buduje reputację.'
        impacts:
          plynnosc: -5
          cyber: 0
          regulacje: 5
          reputacja: 12
        stock_delta: 2.0
      - label: 'Publiczne oświadczenie: ''Jesteśmy ofiarą zorganizowanego ataku państwowego'''
        description: Oświadczasz publicznie, że bank jest ofiarą zorganizowanego ataku państwowego. Zyskujesz empatię, ale budzisz też pytania o bezpieczeństwo i niepewność geopolityczną.
        impacts:
          plynnosc: 0
          cyber: 3
          regulacje: -5
          reputacja: 5
        stock_delta: -1.0
      - label: Zażądaj interwencji ABW i Cyber.mil.pl
        description: Wzywasz ABW i komponenty cyberobrony MON do wsparcia. Służby pomagają przy infrastrukturze krytycznej, ale wchodzisz w tryb postępowania, którego tempem nie sterujesz.
        impacts:
          plynnosc: 0
          cyber: 8
          regulacje: 10
          reputacja: 3
        stock_delta: 0.0
    learning_points:
    - 'Taktyki obrony anti-DDoS: scrubbing center, blackholing, zapasowe centrum danych'
    - 'Kompromis dostępności: całość usług vs. ruch filtrowany/priorytetyzowany'
    - Solidarność sektorowa (wzajemna obsługa klientów) jako narzędzie zarządzania kryzysem
  - id: S1R5
    title: Kontrola UODO i Postępowanie KNF
    narrative: 'Czwartek. Urząd Ochrony Danych Osobowych rozpoczyna niezapowiedzianą kontrolę. Jednocześnie KNF wszczyna postępowanie wyjaśniające. Okazuje się, że podczas ataku ransomware wycieczono dane
      180 000 klientów (imiona, numery PESEL, numery rachunków). Media publikują screenshoty danych z dark webu. Prawnicy klientów składają pierwsze pozwy zbiorowe.

      '
    broadcast: '⚖️ KONTROLA: UODO i KNF wszczęły postępowania. Wyciek danych 180 000 klientów potwierdzony na dark webie.'
    ciso_question:
      role: CISO
      text: UODO jest w budynku, KNF żąda wyjaśnień. Dane 180K klientów wyciekły. Jak współpracujesz?
      options:
      - label: Pełna współpraca — udostępnij wszystkie logi, raporty i dowody forensic
        description: 'Oddajesz regulatorowi pełną dokumentację: logi, raporty i analizę forenzyczną. Maksymalna współpraca to standard oczekiwany przez UODO i KNF — nawet jeśli dokumentacja ujawnia Twoje
          błędy.'
        impacts:
          plynnosc: -3
          cyber: 5
          regulacje: 18
          reputacja: 8
        stock_delta: -1.0
      - label: Udostępnij tylko wymagane minimum — zachowaj strategiczne informacje
        description: Przekazujesz tylko to, co formalnie wymagane. Zachowujesz materiał na procesy cywilne, ale urząd może odczytać to jako opór i sięgnąć po szersze uprawnienia kontroli.
        impacts:
          plynnosc: 0
          cyber: 0
          regulacje: -10
          reputacja: -5
        stock_delta: -2.0
      - label: Zatrudnij zewnętrzną firmę audytową dla niezależnego raportu
        description: Zatrudniasz dużą firmę audytorską do niezależnego raportu. Wiarygodność wobec regulatora i sądów — ale audyt może odkryć problemy wykraczające poza ten incydent.
