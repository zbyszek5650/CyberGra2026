        description: 'Priorytetujesz: najpierw dane finansowe i personalne (najwyższa kara i wrażliwość), reszta w drugiej kolejności. Pragmatyczne — ale wszystko narażone i tak trzeba zgłosić.'
        impacts:
          plynnosc: -5
          cyber: 10
          regulacje: 5
          reputacja: 5
        stock_delta: -1.0
