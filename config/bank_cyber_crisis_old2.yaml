- id: S4
  title: Atak na Łańcuch Dostaw (Supply Chain)
  subtitle: Kompromitacja Dostawcy • Backdoor • Eskalacja • Containment • Audyt • Nowa Architektura
  description: 'Zaawansowany atak na łańcuch dostaw oprogramowania: atakujący kompromitują zaufanego dostawcę ERP i wstrzykują backdoor w rutynową aktualizację, trafiającą do 2000 organizacji (kontekst:
    SolarWinds, MOVEit). Gracze przechodzą pełny cykl: wykrycie, containment, kaskada na klientów, remediation, audyt 340 dostawców i przebudowa architektury supply chain security.'
  icon: 🔗
  initial_stock_price: 120.0
  rounds:
  - id: S4R1
    title: Kompromitacja Dostawcy Oprogramowania
    narrative: 'Zaufany dostawca systemu ERP, z którego korzysta Twoja organizacja i 2000 innych firm, został zhakowany. Ostatnia aktualizacja (zainstalowana automatycznie 3 dni temu) zawiera ukryty backdoor.
      Dowiedziałeś się z raportu CERT, nie od dostawcy.

      '
    broadcast: '🔗 SUPPLY CHAIN: Dostawca ERP skompromitowany. Backdoor w aktualizacji u 2000 firm. CERT potwierdza.'
    ciso_question:
      role: CISO
      text: Backdoor w aktualizacji ERP. 3 dni aktywności. Jak reagujesz?
      options:
      - label: Natychmiastowy rollback aktualizacji + pełna analiza forensic
        description: 'Cofasz aktualizację, izolujesz serwer ERP i skanujesz środowisko w poszukiwaniu śladów atakującego. Pewne — ale operacje na ERP stają: faktury, magazyn, kadry.'
        impacts:
          plynnosc: -12
          cyber: 15
          regulacje: 8
          reputacja: 5
        stock_delta: -4.0
      - label: Network segmentation — izoluj ERP, ale nie wyłączaj
        description: 'Segmentujesz sieć: ERP odcięte od systemów krytycznych, ale działa w trybie ograniczonym. Kompromis między dostępnością usług a zawieraniem zagrożenia.'
        impacts:
          plynnosc: -5
          cyber: 12
          regulacje: 5
          reputacja: 3
        stock_delta: -2.0
      - label: Threat hunting — szukaj lateral movement w sieci
        description: Zespół threat hunting szuka śladów ruchu poprzecznego (lateral movement) z zainfekowanego ERP. Zakładasz, że backdoor już kogoś zaprosił głębiej — i aktywnie to weryfikujesz.
        impacts:
          plynnosc: -3
          cyber: 18
          regulacje: 3
          reputacja: 0
        stock_delta: -1.0
    ceo_question:
      role: CEO
      text: Dostawca ERP zhakowany. 2000 firm dotkniętych, w tym Twoja. Strategia korporacyjna?
